<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Timesheet Automation Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>

        body {

            background: url('image.png') no-repeat center fixed;

            background-size: cover;

            background-color: #cce5f6;

            height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }

        .container {

            max-width: 900px;

            margin: auto;

        }

        .card {

            margin-bottom: 2rem;

            border-radius: 12px;

        }

        .card-header {

            font-weight: bold;

            background-color: #1f4e75;

            color: white;

            border-top-left-radius: 12px;

            border-top-right-radius: 12px;

        }

        .form-control:disabled {

            background-color: #e9ecef;

        }

        .day-header {

            font-size: 0.85rem;

            font-weight: normal;

            color: #6c757d;

        }

        .welcome-message {

            position: absolute;

            top: 10px;

            left: 10px;

            font-size: 1.2rem;

            color: #1f4e75;

        }

        .logout-button {

            position: absolute;

            top: 10px;

            right: 10px;

        }
    </style>
</head>
<body>
<div class="welcome-message">

    Welcome, <span th:text="${name}">User</span>
</div>
<div class="logout-button">
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-danger">Logout</button>
    </form>
</div>
<div class="container">
    <h2 class="mb-4 text-center">Timesheet</h2>

    <!-- Default Hours Setup -->
    <div class="card">
        <div class="card-header">Set Default Weekly Hours</div>
        <div class="card-body">
            <form id="defaultHoursForm">
                <div class="table-responsive">
                    <table class="table table-bordered text-center" id="defaultHoursTable">
                        <thead>
                        <tr>
                            <th>Project</th>
                            <th>Monday</th>
                            <th>Tuesday</th>
                            <th>Wednesday</th>
                            <th>Thursday</th>
                            <th>Friday</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td><input type="text" name="project" class="form-control" value="Project A"></td>
                            <td><input type="number" name="mon" class="form-control hour-input" value="8" min="0" max="8"></td>
                            <td><input type="number" name="tue" class="form-control hour-input" value="8" min="0" max="8"></td>
                            <td><input type="number" name="wed" class="form-control hour-input" value="8" min="0" max="8"></td>
                            <td><input type="number" name="thu" class="form-control hour-input" value="8" min="0" max="8"></td>
                            <td><input type="number" name="fri" class="form-control hour-input" value="8" min="0" max="8"></td>
                            <td><button type="button" class="btn btn-danger btn-sm" onclick="removeRow(this)">Remove</button></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <button type="button" class="btn btn-secondary mb-2" onclick="addRow('defaultHoursTable')">Add Project</button>
                <button type="submit" class="btn btn-primary">Save Default Hours</button>
            </form>
        </div>
    </div>

    <!-- Last Submitted Week Hours -->
    <div class="card">
        <div class="card-header">Last Submitted Week</div>
        <div class="card-body">
            <form id="lastSubmittedForm">
                <div class="table-responsive">
                    <table class="table table-bordered text-center" id="submittedHoursTable">
                        <thead>
                        <tr>
                            <th>Project</th>
                            <th>Monday<br><span class="day-header">(2025-05-05)</span></th>
                            <th>Tuesday<br><span class="day-header">(2025-05-06)</span></th>
                            <th>Wednesday<br><span class="day-header">(2025-05-07)</span></th>
                            <th>Thursday<br><span class="day-header">(2025-05-08)</span></th>
                            <th>Friday<br><span class="day-header">(2025-05-09)</span></th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td><input type="text" name="project" class="form-control" value="Project A"></td>
                            <td><input type="number" name="mon" class="form-control hour-input" value="8" min="0" max="8"></td>
                            <td><input type="number" name="tue" class="form-control hour-input" value="8" min="0" max="8"></td>
                            <td><input type="number" name="wed" class="form-control hour-input" value="8" min="0" max="8"></td>
                            <td><input type="number" name="thu" class="form-control hour-input" value="8" min="0" max="8"></td>
                            <td><input type="number" name="fri" class="form-control hour-input" value="8" min="0" max="8"></td>
                            <td><button type="button" class="btn btn-danger btn-sm" onclick="removeRow(this)">Remove</button></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <button type="button" class="btn btn-secondary mb-2" onclick="addRow('submittedHoursTable')">Add Project</button>
                <button type="submit" class="btn btn-success">Resubmit</button>
            </form>
        </div>
    </div>
</div>

<script>

    // Limit to max 8 hours/day

    document.addEventListener('input', function (e) {

        if (e.target.classList.contains('hour-input')) {

            const val = parseInt(e.target.value);

            if (val > 8) e.target.value = 8;

        }

    });

    function addRow(tableId) {

        const table = document.getElementById(tableId).querySelector('tbody');

        const newRow = document.createElement('tr');

        newRow.innerHTML = `
<td><input type="text" name="project" class="form-control"></td>
<td><input type="number" name="mon" class="form-control hour-input" value="0" min="0" max="8"></td>
<td><input type="number" name="tue" class="form-control hour-input" value="0" min="0" max="8"></td>
<td><input type="number" name="wed" class="form-control hour-input" value="0" min="0" max="8"></td>
<td><input type="number" name="thu" class="form-control hour-input" value="0" min="0" max="8"></td>
<td><input type="number" name="fri" class="form-control hour-input" value="0" min="0" max="8"></td>
<td><button type="button" class="btn btn-danger btn-sm" onclick="removeRow(this)">Remove</button></td>

        `;

        table.appendChild(newRow);

    }

    function removeRow(button) {

        const row = button.closest('tr');

        row.remove();

    }
</script>
</body>
</html>
