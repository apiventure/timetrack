<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Timesheet Automation - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>
<style>
body {

background: url('/image.jpg') no-repeat center fixed;

background-size: cover;

background-color: #cce5f6;

height: 100vh;

display: flex;

flex-direction: column;

align-items: center;

justify-content: center;

font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

}

.header {

text-align: center;

margin-bottom: 20px;

}

.header h1 {

font-size: 2.8rem;

font-weight: bold;

color: #1f4e75;

}

.header p {

font-size: 1.2rem;

color: #2d6a9f;

}

.card {

width: 600px;

border-radius: 20px;

padding: 2rem;

background: rgba(255, 255, 255, 0.92);

box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

}

.form-label {

font-weight: 600;

color: #1f4e75;

}

.form-control {

border-radius: 10px;

font-size: 1rem;

}

.btn-primary, .btn-success {

border-radius: 10px;

font-weight: bold;

background-color: #1f4e75;

border: none;

}

.btn-primary:hover, .btn-success:hover {

background-color: #163c5a;

}

.hidden {

display: none;

}
</style>
<body>
<div class="header">
    <h1>Smart Time Track</h1>
    <p>Ease your Work || Get Pay in time</p>
</div>
<div class="card">
    <h4 class="text-center mb-4">Login</h4>
    <form id="loginForm" th:action="@{/send-otp}" method="post">
        <div id="emailSection">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" name="email" id="email" placeholder="you@company.com" required>
            <button type="submit" class="btn btn-primary w-100 mt-3">Continue</button>
        </div>
    </form>

    <form id="verifyForm" class="hidden" th:action="@{/verify-otp}" method="post">
        <input type="hidden" name="email" id="verifyEmail">
        <label for="otp" class="form-label">Verification Code</label>
        <input type="text" class="form-control" name="otp" id="otp" placeholder="Enter your code" required>
        <button type="submit" class="btn btn-success w-100 mt-3">Verify and Continue</button>
    </form>
</div>

<script>

    document.getElementById('loginForm').addEventListener('submit', function(event) {

        event.preventDefault();

        const emailInput = document.getElementById('email');

        const verifyEmailInput = document.getElementById('verifyEmail');

        fetch('/send-otp', {

            method: 'POST',

            headers: {'Content-Type': 'application/x-www-form-urlencoded'},

            body: new URLSearchParams({email: emailInput.value})

        }).then(res => {

            if (res.ok) {

                document.getElementById('emailSection').classList.add('hidden');

                document.getElementById('verifyForm').classList.remove('hidden');

                verifyEmailInput.value = emailInput.value;

            } else {

                res.text().then(msg => alert(msg));


            }

        });

    });
</script>
</body>
</html>
